<form
  class="w-full max-w-xl rounded-xl border border-gray-200 bg-white p-6"
  [formGroup]="issueForm"
  (ngSubmit)="onSubmit()"
>
  <div class="mb-6">
    <h2 class="text-lg font-semibold text-gray-900">Create issue</h2>
    <p class="mt-1 text-sm text-gray-500">Add the details for the new issue.</p>
  </div>

  <div class="space-y-5">
    <div>
      <label class="mb-2 block text-sm font-medium text-gray-900" for="title"> Title </label>

      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Enter issue title"
        class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900"
      />
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-gray-900" for="description">
        Description
      </label>

      <textarea
        id="description"
        formControlName="description"
        rows="4"
        placeholder="Describe the issue"
        class="block w-full resize-none rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900"
      ></textarea>
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-gray-900" for="status"> Status </label>

      <input
        id="status"
        type="text"
        formControlName="status"
        placeholder="e.g. Open"
        class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900"
      />
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-gray-900" for="priority"> Priority </label>

      <input
        id="priority"
        type="text"
        formControlName="priority"
        placeholder="e.g. High"
        class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900"
      />
    </div>
  </div>

  <div class="mt-6 flex justify-end border-t border-gray-100 pt-5">
    <button
      type="submit"
      class="rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
    >
      Create issue
    </button>
  </div>
</form>
