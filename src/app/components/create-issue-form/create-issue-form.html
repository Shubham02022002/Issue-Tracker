<div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
  <form [formGroup]="issueForm" (ngSubmit)="onSubmit()">
    <div class="mb-6">
      <h2 class="text-xl font-bold text-gray-900">Create New Issue</h2>
      <p class="mt-1 text-sm text-gray-600">Fill in the details below to create a new issue</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="mb-2 block text-sm font-medium text-gray-900" for="title">
          Title
        </label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Brief description of the issue"
          [class]="issueForm.controls.title.invalid && issueForm.controls.title.touched ? 'block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-2 ring-inset ring-red-500 transition placeholder:text-gray-400 focus:ring-2 focus:ring-red-500' : 'block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900'"
        />
        @if (issueForm.controls.title.invalid && issueForm.controls.title.touched) {
          <p class="mt-1.5 text-sm text-red-600">Title is required</p>
        }
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-gray-900" for="description">
          Description
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Provide detailed information about the issue"
          [class]="issueForm.controls.description.invalid && issueForm.controls.description.touched ? 'block w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-2 ring-inset ring-red-500 transition placeholder:text-gray-400 focus:ring-2 focus:ring-red-500' : 'block w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900'"
        ></textarea>
        @if (issueForm.controls.description.invalid && issueForm.controls.description.touched) {
          <p class="mt-1.5 text-sm text-red-600">Description is required</p>
        }
      </div>

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900" for="status">
            Status
          </label>
          <select
            id="status"
            formControlName="status"
            class="block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition focus:ring-2 focus:ring-gray-900"
          >
            <option value="" disabled>Select status</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900" for="priority">
            Priority
          </label>
          <select
            id="priority"
            formControlName="priority"
            class="block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition focus:ring-2 focus:ring-gray-900"
          >
            <option value="" disabled>Select priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
    </div>

    <div class="mt-8 flex justify-end gap-3 border-t border-gray-100 pt-6">
      <button
        type="button"
        (click)="onCancel()"
        class="rounded-lg px-5 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="issueForm.invalid"
        [class.opacity-50]="issueForm.invalid"
        [class.cursor-not-allowed]="issueForm.invalid"
        class="rounded-lg bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 disabled:hover:bg-gray-900"
      >
        Create Issue
      </button>
    </div>
  </form>
</div>
