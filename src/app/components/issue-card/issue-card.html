<article
  class="m-2 rounded-xl border border-gray-200 bg-white p-5 transition hover:border-gray-300"
>
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold text-gray-900">
        {{ issue().title }}
      </h3>

      <p class="mt-1 text-sm leading-6 text-gray-500">
        {{ issue().description }}
      </p>
    </div>

    <button
      type="button"
      class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
      (click)="handleDelete()"
    >
      Delete
    </button>
  </div>

  <div class="mt-4 flex items-center gap-2">
    <span class="rounded-md bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-700">
      {{ issue().status }}
    </span>

    <span class="rounded-md bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-700">
      {{ issue().priority }}
    </span>
  </div>
</article>
