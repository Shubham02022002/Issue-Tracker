@if (!isEditing()) {
  <article
    class="group relative overflow-hidden rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition hover:shadow-md hover:border-gray-300"
  >
    <div class="mb-4 flex items-start justify-between gap-4">
      <div class="min-w-0 flex-1">
        <h3 class="text-base font-semibold text-gray-900 line-clamp-2">
          {{ issue().title }}
        </h3>
        <p class="mt-2 text-sm leading-relaxed text-gray-600 line-clamp-3">
          {{ issue().description }}
        </p>
      </div>
    </div>

    <div class="mt-4 flex items-center gap-2">
      <span
        [class]="getStatusClass(issue().status)"
        class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium"
      >
        <span [class]="getStatusDotClass(issue().status)" class="h-1.5 w-1.5 rounded-full"></span>
        {{ getStatusLabel(issue().status) }}
      </span>

      <span
        [class]="getPriorityClass(issue().priority)"
        class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium"
      >
        {{ getPriorityLabel(issue().priority) }}
      </span>
    </div>

    <div class="mt-6 flex items-center gap-2 border-t border-gray-100 pt-4">
      <button
        type="button"
        class="flex-1 rounded-lg bg-gray-50 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
        (click)="handleEdit()"
      >
        Edit
      </button>

      <button
        type="button"
        class="flex-1 rounded-lg bg-red-50 px-4 py-2 text-sm font-medium text-red-600 transition hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
        (click)="handleDelete()"
      >
        Delete
      </button>
    </div>
  </article>
} @else {
  <article class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <form [formGroup]="editForm" (ngSubmit)="handleSave()">
      <div class="space-y-5">
        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-900"
            for="edit-title-{{ issue().id }}"
          >
            Title
          </label>
          <input
            [id]="'edit-title-' + issue().id"
            type="text"
            formControlName="title"
            placeholder="Enter issue title"
            class="block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900"
          />
        </div>

        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-900"
            for="edit-description-{{ issue().id }}"
          >
            Description
          </label>
          <textarea
            [id]="'edit-description-' + issue().id"
            formControlName="description"
            rows="4"
            placeholder="Describe the issue"
            class="block w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              class="mb-2 block text-sm font-medium text-gray-900"
              for="edit-status-{{ issue().id }}"
            >
              Status
            </label>
            <select
              [id]="'edit-status-' + issue().id"
              formControlName="status"
              class="block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition focus:ring-2 focus:ring-gray-900"
            >
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="closed">Closed</option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-sm font-medium text-gray-900"
              for="edit-priority-{{ issue().id }}"
            >
              Priority
            </label>
            <select
              [id]="'edit-priority-' + issue().id"
              formControlName="priority"
              class="block w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 transition focus:ring-2 focus:ring-gray-900"
            >
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3 border-t border-gray-100 pt-5">
        <button
          type="button"
          class="rounded-lg px-5 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
          (click)="handleCancel()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="rounded-lg bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
        >
          Save changes
        </button>
      </div>
    </form>
  </article>
}
